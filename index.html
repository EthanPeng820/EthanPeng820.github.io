<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 页面编码、移动端视口、搜索摘要和浏览器标签页图标。 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个简洁、可搜索的个人网址导航页，把常用的网站和灵感放在一起。"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Navigation Hub</title>

    <!-- 样式与脚本均使用同目录相对路径，兼容 GitHub Pages 项目子路径。 -->
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./supabase-config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand-group">
        <a class="brand" href="#" aria-label="Ethan's 导航站首页">
          <span class="brand-mark" aria-hidden="true">E</span>
          <span class="brand-copy">
            <span class="brand-name">Navigation Hub</span>
            <span class="brand-caption">Ethan Peng</span>
          </span>
        </a>
        <p class="site-uptime" role="status" aria-live="polite">
          <span class="site-uptime-label">本站已运行</span>
          <time id="site-uptime" datetime="2026-11-15T08:20:00+08:00">计算中...</time>
        </p>
      </div>

      <section class="web-search-section" aria-label="外部搜索">
        <form class="web-search-box" id="web-search-form" role="search" target="_blank" rel="noopener">
          <label class="visually-hidden" for="web-search-engine">搜索引擎</label>
          <select id="web-search-engine" aria-label="选择搜索源">
            <option value="bing">必应</option>
            <option value="baidu">百度</option>
            <option value="google">Google</option>
            <option value="yandex">Yandex</option>
          </select>
          <label class="visually-hidden" for="web-search-query">搜索全网</label>
          <input
            id="web-search-query"
            type="search"
            name="q"
            placeholder="搜索全网..."
            autocomplete="off"
          />
          <button class="web-search-submit" type="submit">搜索</button>
        </form>
      </section>

      <div class="topbar-right">
        <div class="live-clock" aria-label="当前公历日期、农历和时间">
          <div class="clock-column clock-date-column">
            <span class="clock-label">公历日期</span>
            <span class="clock-date clock-value" id="clock-date"></span>
            <span class="clock-lunar" id="clock-lunar"></span>
          </div>
          <span class="clock-divider" aria-hidden="true"></span>
          <div class="clock-column clock-time-column">
            <span class="clock-label">当前时间</span>
            <time class="clock-time clock-value" id="clock-time"></time>
          </div>
        </div>
      </div>
    </header>

    <!-- 固定侧边栏：分类由 JavaScript 生成，支持展开/收起。 -->
    <aside class="sidebar" id="sidebar" aria-label="导航侧边栏">
      <section class="sidebar-search-section" aria-label="站内搜索">
        <form class="search-box" id="search-form" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.3 4.3"></path>
          </svg>
          <label class="visually-hidden" for="site-search">搜索书签或网页</label>
          <input
            id="site-search"
            type="search"
            placeholder="搜索书签或网页..."
            autocomplete="off"
          />
          <button class="search-submit" type="submit">
            GO! <span aria-hidden="true">↗</span>
          </button>
          <button class="sidebar-search-expand" type="button" aria-label="展开侧边栏并搜索" title="展开侧边栏并搜索">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"></circle>
              <path d="m16 16 4.3 4.3"></path>
            </svg>
          </button>
        </form>
      </section>
      <div class="sidebar-section-label">分类导航</div>
      <nav class="category-nav" id="category-nav" aria-label="书签分类"></nav>

      <div class="sidebar-bottom">
        <div class="sidebar-tools">
          <a
            class="sidebar-github-link"
            href="https://github.com/EthanPeng820/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="访问 EthanPeng820 的 GitHub 主页"
            title="GitHub 主页"
          >
            <span class="sidebar-github-icon" aria-hidden="true">GH</span>
            <span class="sidebar-tool-label">GitHub 主页</span>
            <span class="sidebar-link-arrow" aria-hidden="true">↗</span>
          </a>
          <button
            class="icon-button theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="切换深色主题"
            title="切换深色主题"
          >
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.8"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.1A8.4 8.4 0 0 1 8.9 3.8a8.6 8.6 0 1 0 11.3 11.3Z"></path>
            </svg>
            <span class="sidebar-tool-label">切换主题</span>
          </button>
        </div>
        <div class="sidebar-profile">
          <span class="profile-avatar" aria-hidden="true">E</span>
          <div class="profile-info">
            <span class="profile-name">Ethan Peng</span>
            <span class="profile-caption">导航站管理员</span>
          </div>
        </div>
        <button
          class="sidebar-toggle"
          id="sidebar-toggle"
          type="button"
          aria-controls="sidebar"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m14.5 5-7 7 7 7"></path>
            <path d="M8 12h12"></path>
          </svg>
          <span class="sidebar-toggle-label">收起侧边栏</span>
        </button>
      </div>
    </aside>

    <!-- 主工作区：书签卡片。 -->
    <div class="workspace">
      <main class="main-content">
        <!-- 书签卡片由 app.js 根据分类和搜索词动态填入。 -->
        <section class="directory-section" aria-label="网址导航">
          <div class="directory-heading">
            <div>
              <span class="section-kicker">QUICK ACCESS</span>
              <h2 id="directory-title">常用网站</h2>
            </div>
          <span class="link-count" id="link-count"></span>
        </div>
        <p class="data-status" id="data-status" role="status" aria-live="polite" hidden></p>
          <div class="bookmark-grid" id="bookmark-grid" aria-live="polite"></div>
          <p class="empty-state" id="empty-state" hidden>没有找到相关网站，试试其他关键词吧。</p>
        </section>
      </main>

    </div>
  </body>
</html>
